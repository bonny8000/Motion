<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion system showcase — foundations to patterns</title>
</head>
<body>
<script type="module">
/**
 * SYSTEM SHOWCASE
 *
 * Demonstrates role-based visual tokens, a complete theme, a motion profile,
 * semantic intent color, and reusable components assembled into one pattern.
 * The claim is intentionally about the system itself: foundations become
 * components, components become patterns, and review resolves each one.
 *
 * This is also the smoke test for the role layer — the `productLight` theme
 * plus the intent roles. Two outcomes are shown, and they are two genuine
 * CLAIMS rather than two decorations: what passed review (`positive`) and what
 * was rejected (`critical`). That is the bar `visual-foundations.md` sets for
 * spending a second colour, and it is the reason this scene is allowed two.
 *
 * Outcome is never carried by hue alone. Passing items also go accent-bright,
 * scale up and hold position; rejected items dim and stay put. Colour
 * reinforces the read — position, brightness and scale carry it.
 *
 * Note the profile: `calm`, not `product`. The product cadence tops out at
 * 300ms because it is tuned for motion a user triggers. In a 9.5s narrative a
 * 150ms beat reads as a flicker. Take those curves; take their durations only
 * for product-embedded work.
 */
import { createScene, shapes, beats } from '../lib/kit.js';

const T = {
  panel: .45,
  field: .8,
  inspect: 2.7,
  curate: 4.7,
  resolve: 5.85,
  hold: 7.15,
  exit: 7.85,
  cycle: 9.5,
};

const scene = createScene({
  theme: 'productLight',
  motion: 'calm',
  card: { w: 1240, h: 610 },
  labelTop: 38,
  tokens: {
    fontSizeLabel: '29px',
    strokeFrame: '2px',
  },
});

const panel = scene.panel();
const body = shapes.cardGrid(scene, {
  cols: 4,
  rows: 3,
  cw: 252,
  ch: 112,
  gap: 28,
  pad: { left: 74, top: 132 },
});

const PASS   = [0, 5, 7, 10].map((i) => body.items[i]);
const REJECT = [2, 9].map((i) => body.items[i]);
const REST   = body.items.filter((i) => !PASS.includes(i) && !REJECT.includes(i));

// The conversion fill is what every convert/promote beat animates, so setting
// its colour per item is how an outcome gets a role without touching a beat.
PASS.forEach((i) => { i.fill.style.background = 'var(--color-positive)'; });
REJECT.forEach((i) => { i.fill.style.background = 'var(--color-critical)'; });

scene.setLabels(['Foundations', 'Components', 'In review', 'Resolved']);

beats.reset(scene, { panel, body });
beats.fillPanel(scene, panel, { at: T.panel, duration: scene.motion.enterPrimary });
beats.enter(scene, body, { at: T.field, per: scene.motion.stagger * 1.4 });
beats.scan(scene, body, {
  at: T.inspect,
  per: scene.motion.transform,
  count: body.groups.length,
  until: T.curate - .12,
});

// Everything the scan touched turns accent. Review then separates the three
// outcomes: rejected items keep a critical mark but recede, unreviewed items
// lose the accent entirely, and only what passed is promoted.
beats.unconvert(scene, body, REST, { at: T.curate, duration: scene.motion.exit });
beats.recede(scene, REST, {
  at: T.curate + .08,
  to: .13,
  duration: scene.motion.transform,
  stagger: scene.motion.stagger,
});
beats.recede(scene, REJECT, {
  at: T.curate + .16,
  to: .38,
  duration: scene.motion.transform,
  stagger: scene.motion.stagger,
});
beats.promote(scene, body, PASS, {
  at: T.resolve,
  duration: scene.motion.enterPrimary,
  scale: 1.045,
});

beats.labelCues(scene, [
  ['Foundations', T.panel],
  ['Components', T.field + .6],
  ['In review', T.inspect],
  ['Resolved', T.resolve],
], { end: T.exit + .35 });

beats.collapse(scene, { at: T.exit, duration: 1.25, to: .02 });
scene.run({ cycle: T.cycle, still: T.hold, reduced: 'still' });
</script>
</body>
</html>
