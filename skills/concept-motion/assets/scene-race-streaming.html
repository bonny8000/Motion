<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Audio Feedback</title>
<style>
  :root{
    --bg:#657689; --card:#1a2931; --accent:#0061de;
    --bar-a:#78868e; --bar-b:#5e6c74; --bar-c:#46545c;
    --good-a:#2f7cff; --good-b:#38bdf8;
    --good-c:#7c6cff; --good-d:#24c997;
    --label:#e8eef0; --frame:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg)}
  body{display:grid;place-items:center;
    font-family:'Inter','PingFang TC','Microsoft JhengHei','Noto Sans TC',
                -apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}

  /* REFERENCE FINGERPRINT
     One centered 1290×590 hero, a flat material, a fixed state label, frame
     handles and a closing collapse. The comparison lives INSIDE that grammar;
     it does not replace the reference with two unrelated hero cards. */
  .stage{position:relative;width:1600px;height:900px;background:var(--bg);overflow:hidden}
  #unit{position:absolute;inset:0;transform-origin:center center}
  #panel{position:absolute;left:155px;top:155px;width:1290px;height:590px;
         background:var(--card);border-radius:36px;opacity:0}

  #frame,#roundFrame{position:absolute;left:155px;top:155px;width:1290px;height:590px}
  #roundFrame{overflow:visible;pointer-events:none}
  #roundFrame rect{fill:none;stroke:var(--frame);stroke-width:1;path-length:1;
                   stroke-dasharray:1;stroke-dashoffset:1;vector-effect:non-scaling-stroke}
  #frame .edge{position:absolute;background:var(--frame)}
  #frame .top,#frame .bottom{left:0;width:100%;height:1px;transform:scaleX(0);transform-origin:left}
  #frame .left,#frame .right{top:0;width:1px;height:100%;transform:scaleY(0);transform-origin:top}
  #frame .top{top:0} #frame .bottom{bottom:0}
  #frame .left{left:0} #frame .right{right:0}
  #frame .handle{position:absolute;width:7px;height:7px;background:var(--frame);
                 border-radius:50%;opacity:0}
  #frame .tl{left:-3px;top:-3px} #frame .tr{right:-3px;top:-3px}
  #frame .bl{left:-3px;bottom:-3px} #frame .br{right:-3px;bottom:-3px}

  .state{position:absolute;left:155px;top:190px;width:1244px;text-align:right;
         color:var(--label);font-size:27px;font-weight:450;letter-spacing:-.01em;
         white-space:nowrap;opacity:0}

  #voice{position:absolute;left:199px;top:240px;width:1160px;height:72px;
         display:flex;align-items:center;padding:0 22px;gap:16px;
         color:var(--label);background:#22343e;border:1px solid rgba(255,255,255,.08);
         border-radius:22px;opacity:0}
  #mic{position:relative;width:42px;height:42px;flex:0 0 auto;border-radius:50%;
       background:rgba(47,124,255,.18);border:1px solid rgba(56,189,248,.42)}
  #mic::before{content:"";position:absolute;left:16px;top:9px;width:8px;height:15px;
               border:2px solid #8edcff;border-radius:8px}
  #mic::after{content:"";position:absolute;left:12px;top:20px;width:16px;height:10px;
              border:2px solid #8edcff;border-top:0;border-radius:0 0 10px 10px}
  .voice-copy{position:relative;width:220px;height:40px;flex:0 0 auto}
  .voice-copy strong{display:block;font-size:14px;font-weight:520;color:#96a6ae;
                     letter-spacing:.02em;text-transform:uppercase}
  .voice-copy span{position:absolute;left:0;bottom:0;font-size:21px;font-weight:500;white-space:nowrap}
  #voiceCaptured{opacity:0}
  #wave{height:38px;display:flex;align-items:center;gap:7px;margin-left:auto;opacity:0}
  #wave i{display:block;width:4px;height:28px;border-radius:4px;
          background:var(--good-b);transform:scaleY(.18)}

  .lane{position:absolute;left:199px;width:1160px;opacity:0}
  #laneA{top:350px} #laneB{top:530px}
  .lane-title{display:flex;align-items:center;gap:12px;color:var(--label);
              font-size:22px;font-weight:500;letter-spacing:-.01em}
  .lane-title::before{content:"";display:block;width:7px;height:7px;
                      border-radius:50%;background:var(--bar-b)}
  #laneA .lane-title{color:#aeb9be}
  #laneB .lane-title::before{background:var(--accent)}
  .words{position:absolute;left:0;top:46px;display:flex;align-items:center;gap:12px}
  .word{padding:12px 17px;border-radius:15px;font-size:25px;font-weight:520;
        line-height:1.15;white-space:nowrap;opacity:0;transform:translateY(10px) scale(.96)}
  #wordsA .word{color:#b1bcc1;background:#35444c;border:1px solid #46545c}
  #wordsB .word{color:#f8fbff;border:1px solid rgba(255,255,255,.16)}
  #wordsB .word:nth-child(1),#wordsB .word:nth-child(5){background:var(--good-a)}
  #wordsB .word:nth-child(2),#wordsB .word:nth-child(6){background:var(--good-b);color:#102a36}
  #wordsB .word:nth-child(3){background:var(--good-c)}
  #wordsB .word:nth-child(4){background:var(--good-d);color:#102f29}

  #loader{position:absolute;left:0;top:63px;display:flex;gap:10px;opacity:0}
  #loader i{width:10px;height:10px;border-radius:50%;background:var(--bar-b);opacity:.22}
  #caret{position:absolute;left:199px;top:581px;width:3px;height:31px;border-radius:3px;
         background:var(--good-b);opacity:0;box-shadow:0 0 12px rgba(56,189,248,.58)}

  #selection{position:absolute;left:191px;top:386px;height:70px;width:0;
             border:2px solid var(--accent);border-radius:18px;opacity:0}
  #selection i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  #selection i:nth-child(1){left:-3px;top:-3px}
  #selection i:nth-child(2){right:-3px;top:-3px}
  #selection i:nth-child(3){left:-3px;bottom:-3px}
  #selection i:nth-child(4){right:-3px;bottom:-3px}

  #dot{position:absolute;left:797px;top:448px;width:6px;height:6px;
       border-radius:50%;background:var(--label);opacity:0}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div id="dot"></div>
  <div id="unit">
    <div id="panel"></div>
    <svg id="roundFrame" viewBox="0 0 1290 590" aria-hidden="true">
      <rect x=".5" y=".5" width="1289" height="589" rx="35.5" pathLength="1"></rect>
    </svg>
    <div id="frame">
      <i class="handle tl"></i><i class="handle tr"></i>
      <i class="handle bl"></i><i class="handle br"></i>
    </div>

    <div class="state" id="stateStart">Start speaking</div>
    <div class="state" id="stateReadable">Words appear as you speak</div>
    <div class="state" id="stateProof">Feedback 0.0s sooner</div>

    <div id="voice">
      <div id="mic"></div>
      <div class="voice-copy">
        <strong>Audio input</strong>
        <span id="voiceListening">Listening…</span>
        <span id="voiceCaptured">Audio captured</span>
      </div>
      <div id="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <section class="lane" id="laneA">
      <div class="lane-title">After recording</div>
      <div id="loader"><i></i><i></i><i></i></div>
      <div class="words" id="wordsA"></div>
    </section>
    <section class="lane" id="laneB">
      <div class="lane-title">Live transcript</div>
      <div class="words" id="wordsB"></div>
    </section>

    <div id="caret"></div>
    <div id="selection"><i></i><i></i><i></i><i></i></div>
  </div>
</main>

<script>
/* Standalone, zero-network WAAPI scene. Every narrative animation spans the
   same 16.8s cycle, so any moment can be sought deterministically with ?t=N. */
const CYCLE = 16800;
const o = (seconds) => seconds * 1000 / CYCLE;
const E = {
  out:  'cubic-bezier(.23,1,.32,1)',
  snap: 'cubic-bezier(.34,1.42,.64,1)',
  wipe: 'cubic-bezier(.18,.78,.24,1)',
  move: 'cubic-bezier(.77,0,.175,1)',
  exit: 'cubic-bezier(.5,0,.75,0)',
};
const T = {
  dotEnd:.95, draw:.95, drawHalf:1.85, fill:3.05, ready:3.55,
  stream:4.30, block:9.05, proof:9.55, scan:10.15,
  build:14.25, collapse:14.85, collapseEnd:16.25,
};
const STREAM = [
  {start:4.30, duration:.52},
  {start:5.05, duration:.38},
  {start:5.62, duration:.62},
  {start:6.50, duration:.44},
  {start:7.18, duration:.46},
  {start:7.90, duration:.68},
];
const PHRASE = ['Book', 'a', 'table', 'for', 'two', 'tonight'];
const $ = (selector) => document.querySelector(selector);
const $$ = (selector) => [...document.querySelectorAll(selector)];
const anims = [];

const run = (target, frames, options = {}) => {
  const animation = target.animate(frames, {
    duration:CYCLE, iterations:Infinity, fill:'both', ...options,
  });
  anims.push(animation);
  return animation;
};

const buildWords = (host) => PHRASE.map((text) => {
  const word = document.createElement('span');
  word.className = 'word';
  word.textContent = text;
  host.appendChild(word);
  return word;
});
const wordsA = buildWords($('#wordsA'));
const wordsB = buildWords($('#wordsB'));

/* The opening point becomes the top-left anchor instead of disappearing as a
   disconnected ornament. The frame grows directly from that same object. */
run($('#dot'), [
  {offset:0,opacity:0,transform:'translate(-34px,16px) scale(.6)'},
  {offset:o(.14),opacity:1,transform:'translate(0,0) scale(1)',easing:E.out},
  {offset:o(.52),opacity:1,transform:'translate(0,0) scale(1)',easing:E.move},
  {offset:o(T.dotEnd),opacity:1,transform:'translate(-606px,-293px) scale(1.4)'},
  {offset:o(T.fill-.10),opacity:1,transform:'translate(-606px,-293px) scale(1.4)',easing:E.out},
  {offset:o(T.fill+.14),opacity:0,transform:'translate(-606px,-293px) scale(1)'},
  {offset:1,opacity:0,transform:'translate(-606px,-293px) scale(1)'},
]);
const roundedOutline = $('#roundFrame rect');
run(roundedOutline, [
  {offset:0,strokeDashoffset:1},
  {offset:o(T.draw),strokeDashoffset:1,easing:E.out},
  {offset:o(T.fill),strokeDashoffset:0},
  {offset:1,strokeDashoffset:0},
]);
run($('#panel'), [
  {offset:0,opacity:0,transform:'scale(.994)'},
  {offset:o(T.fill),opacity:0,transform:'scale(.994)',easing:E.out},
  {offset:o(T.ready),opacity:1,transform:'scale(1)'},
  {offset:1,opacity:1,transform:'scale(1)'},
]);
$$('#frame .handle').forEach((handle) => run(handle, [
  {offset:0,opacity:0,transform:'scale(0)'},
  {offset:o(T.fill-.12),opacity:0,transform:'scale(0)',easing:E.snap},
  {offset:o(T.fill+.10),opacity:1,transform:'scale(1.28)',easing:E.out},
  {offset:o(T.fill+.28),opacity:1,transform:'scale(1)'},
  {offset:1,opacity:1,transform:'scale(1)'},
]));

/* The rounded input control bridges abstract frame construction to a concrete
   user action: speaking. It remains visible while both feedback models run. */
run($('#voice'), [
  {offset:0,opacity:0,transform:'translateY(12px) scale(.985)'},
  {offset:o(T.ready+.08),opacity:0,transform:'translateY(12px) scale(.985)',easing:E.snap},
  {offset:o(T.ready+.38),opacity:1,transform:'translateY(-2px) scale(1)',easing:E.out},
  {offset:o(T.ready+.56),opacity:1,transform:'translateY(0) scale(1)'},
  {offset:1,opacity:1,transform:'translateY(0) scale(1)'},
]);
run($('#wave'), [
  {offset:0,opacity:0},{offset:o(T.stream-.10),opacity:0,easing:E.out},
  {offset:o(T.stream+.08),opacity:1},{offset:o(T.block-.12),opacity:1},
  {offset:o(T.block+.18),opacity:.22},{offset:1,opacity:.22},
]);
$$('#wave i').forEach((bar, index) => {
  const animation = bar.animate([
    {transform:'scaleY(.18)',opacity:.45},
    {transform:`scaleY(${.58 + (index%4)*.14})`,opacity:1},
    {transform:'scaleY(.26)',opacity:.58},
  ], {
    duration:620 + (index%3)*170, delay:index*54, iterations:Infinity,
    easing:'cubic-bezier(.45,0,.55,1)', fill:'both',
  });
  anims.push(animation);
});
run($('#mic'), [
  {offset:0,boxShadow:'0 0 0 0 rgba(56,189,248,0)'},
  {offset:o(T.stream),boxShadow:'0 0 0 0 rgba(56,189,248,0)',easing:E.out},
  {offset:o(T.stream+.36),boxShadow:'0 0 0 9px rgba(56,189,248,.12)'},
  {offset:o(T.stream+.72),boxShadow:'0 0 0 0 rgba(56,189,248,0)'},
  {offset:o(T.block),boxShadow:'0 0 0 0 rgba(56,189,248,0)'},
  {offset:1,boxShadow:'0 0 0 0 rgba(56,189,248,0)'},
]);
run($('#voiceListening'), [
  {offset:0,opacity:1,transform:'translateY(0)'},
  {offset:o(T.block-.14),opacity:1,transform:'translateY(0)',easing:E.out},
  {offset:o(T.block+.14),opacity:0,transform:'translateY(-6px)'},
  {offset:1,opacity:0,transform:'translateY(-6px)'},
]);
run($('#voiceCaptured'), [
  {offset:0,opacity:0,transform:'translateY(7px)'},
  {offset:o(T.block-.05),opacity:0,transform:'translateY(7px)',easing:E.out},
  {offset:o(T.block+.20),opacity:1,transform:'translateY(0)'},
  {offset:1,opacity:1,transform:'translateY(0)'},
]);

/* The two feedback models enter within the same rounded hero. */
[$('#laneA'), $('#laneB')].forEach((lane, index) => {
  const start = T.ready + .28 + index*.10;
  run(lane, [
    {offset:0,opacity:0,transform:'translateY(14px)'},
    {offset:o(start),opacity:0,transform:'translateY(14px)',easing:E.snap},
    {offset:o(start+.26),opacity:1,transform:'translateY(-2px)',easing:E.out},
    {offset:o(start+.44),opacity:1,transform:'translateY(0)'},
    {offset:1,opacity:1,transform:'translateY(0)'},
  ]);
});
run($('#loader'), [
  {offset:0,opacity:0},{offset:o(T.ready+.10),opacity:0},
  {offset:o(T.ready+.30),opacity:1},{offset:o(T.block-.10),opacity:1},
  {offset:o(T.block+.05),opacity:0},{offset:1,opacity:0},
]);
$$('#loader i').forEach((dot, index) => {
  const animation = dot.animate([{opacity:.22},{opacity:1},{opacity:.22}], {
    duration:1040, delay:index*145, iterations:Infinity,
    easing:'cubic-bezier(.45,0,.55,1)', fill:'both',
  });
  anims.push(animation);
});

/* Live transcript: the words appear at the moment they are heard, so the user
   can read back the request while still speaking. */
wordsB.forEach((word, index) => {
  const reveal = STREAM[index].start + .18;
  run(word, [
    {offset:0,opacity:0,transform:'translateY(10px) scale(.96)'},
    {offset:o(reveal),opacity:0,transform:'translateY(10px) scale(.96)',easing:E.snap},
    {offset:o(reveal+.20),opacity:1,transform:'translateY(-2px) scale(1.03)',easing:E.out},
    {offset:o(reveal+.38),opacity:1,transform:'translateY(0) scale(1)'},
    {offset:1,opacity:1,transform:'translateY(0) scale(1)'},
  ]);
});

/* The caret advances word by word, then becomes the comparison outline. */
const caretFrames = [{offset:0,transform:'translate(0,0)'}];
let caretRight = 0;
wordsB.forEach((word, index) => {
  const reveal = STREAM[index].start + .18;
  const nextRight = word.offsetLeft + word.offsetWidth + 8;
  caretFrames.push({offset:o(reveal),transform:`translate(${caretRight}px,0)`,easing:E.snap});
  caretFrames.push({offset:o(reveal+.22),transform:`translate(${nextRight}px,0)`});
  caretRight = nextRight;
});
caretFrames.push({offset:1,transform:caretFrames.at(-1).transform});
run($('#caret'), caretFrames);
run($('#caret'), [
  {offset:0,opacity:0},{offset:o(T.stream-.08),opacity:0},
  {offset:o(T.stream+.04),opacity:1},{offset:o(T.scan-.36),opacity:1},
  {offset:o(T.scan-.12),opacity:0},{offset:1,opacity:0},
]);

/* Delayed transcript: no text feedback is available until recording ends. */
wordsA.forEach((word, index) => {
  const start = T.block + index*.055;
  run(word, [
    {offset:0,opacity:0,transform:'translateY(14px) scale(.97)'},
    {offset:o(start),opacity:0,transform:'translateY(14px) scale(.97)',easing:E.snap},
    {offset:o(start+.20),opacity:1,transform:'translateY(-2px) scale(1.02)',easing:E.out},
    {offset:o(start+.38),opacity:1,transform:'translateY(0) scale(1)'},
    {offset:1,opacity:1,transform:'translateY(0) scale(1)'},
  ]);
});

/* The completed caret expands into one rounded comparison outline: muted row
   first, live colourful row second. No new unrelated object is introduced. */
const rowWidth = Math.max(
  wordsA.at(-1).offsetLeft + wordsA.at(-1).offsetWidth,
  wordsB.at(-1).offsetLeft + wordsB.at(-1).offsetWidth,
) + 16;
const caretJoin = {x:caretRight+8, y:195};
const selectionFrames = [
  {offset:0,opacity:0,transform:`translate(${caretJoin.x}px,${caretJoin.y}px) scaleY(.5)`,width:'0px'},
  {offset:o(T.scan-.36),opacity:0,transform:`translate(${caretJoin.x}px,${caretJoin.y}px) scaleY(.5)`,width:'0px'},
  {offset:o(T.scan-.16),opacity:1,transform:`translate(${caretJoin.x}px,${caretJoin.y}px) scaleY(.5)`,width:'0px',easing:E.move},
  {offset:o(T.scan+.22),opacity:1,transform:'translate(0,0) scaleY(1)',width:rowWidth+'px'},
  {offset:o(T.scan+1.52),opacity:1,transform:'translate(0,0) scaleY(1)',width:rowWidth+'px',easing:E.move},
  {offset:o(T.scan+2.02),opacity:1,transform:'translate(0,180px) scaleY(1)',width:rowWidth+'px'},
  {offset:o(T.scan+3.28),opacity:1,transform:'translate(0,180px) scaleY(1)',width:rowWidth+'px',easing:E.out},
  {offset:o(T.scan+3.55),opacity:0,transform:'translate(0,180px) scaleY(.94)',width:rowWidth+'px'},
  {offset:1,opacity:0,transform:'translate(0,180px) scaleY(.94)',width:rowWidth+'px'},
];
run($('#selection'), selectionFrames);
const colourHandoff = T.scan + 1.60;
run($('#selection'), [
  {offset:0,borderColor:'var(--bar-a)'},
  {offset:o(colourHandoff-.12),borderColor:'var(--bar-a)',easing:E.out},
  {offset:o(colourHandoff+.20),borderColor:'var(--accent)'},
  {offset:1,borderColor:'var(--accent)'},
]);
$$('#selection i').forEach((handle) => run(handle, [
  {offset:0,backgroundColor:'var(--bar-a)'},
  {offset:o(colourHandoff-.12),backgroundColor:'var(--bar-a)',easing:E.out},
  {offset:o(colourHandoff+.20),backgroundColor:'var(--accent)'},
  {offset:1,backgroundColor:'var(--accent)'},
]));

/* One fixed state slot; outgoing text is gone before the next label enters. */
const label = (node, start, end) => run(node, [
  {offset:0,opacity:0,transform:'translateY(8px)'},
  {offset:o(start),opacity:0,transform:'translateY(8px)',easing:E.out},
  {offset:o(start+.26),opacity:1,transform:'translateY(0)'},
  {offset:o(end-.24),opacity:1,transform:'translateY(0)',easing:E.out},
  {offset:o(end),opacity:0,transform:'translateY(-6px)'},
  {offset:1,opacity:0,transform:'translateY(-6px)'},
]);
const firstStreamReadable = STREAM[0].start + .38;
const firstBlockReadable = T.block + .40;
$('#stateProof').textContent = `Feedback ${(firstBlockReadable-firstStreamReadable).toFixed(1)}s sooner`;
label($('#stateStart'), T.ready+.05, firstStreamReadable-.04);
label($('#stateReadable'), firstStreamReadable, T.proof-.04);
label($('#stateProof'), T.proof, T.collapse+.35);

/* Reference payoff: chrome turns accent, then the complete hero collapses to a
   point and fades before the cycle resets. */
$$('#frame .edge, #frame .handle').forEach((chrome, index) => {
  const start = T.build + index*.055;
  run(chrome, [
  {offset:0,backgroundColor:'var(--frame)'},
  {offset:o(start),backgroundColor:'var(--frame)',easing:E.out},
  {offset:o(start+.34),backgroundColor:'var(--accent)'},
  {offset:1,backgroundColor:'var(--accent)'},
  ]);
});
run(roundedOutline, [
  {offset:0,stroke:'var(--frame)'},
  {offset:o(T.build),stroke:'var(--frame)',easing:E.out},
  {offset:o(T.build+.34),stroke:'var(--accent)'},
  {offset:1,stroke:'var(--accent)'},
]);
run($('#unit'), [
  {offset:0,transform:'scale(1)',opacity:1},
  {offset:o(T.collapse),transform:'scale(1)',opacity:1,easing:E.out},
  {offset:o(T.collapse+.24),transform:'scale(1.018)',opacity:1,easing:E.exit},
  {offset:o(T.collapseEnd),transform:'scale(.012)',opacity:0},
  {offset:1,transform:'scale(.012)',opacity:0},
]);

/* Synchronize, then expose a deterministic inspection contract. */
const timelineNow = document.timeline.currentTime ?? 0;
anims.forEach((animation) => { animation.startTime = timelineNow; });
const seek = (seconds) => {
  const ms = ((Number(seconds)*1000 % CYCLE) + CYCLE) % CYCLE;
  anims.forEach((animation) => { animation.pause(); animation.currentTime = ms; });
};
const requested = new URLSearchParams(location.search).get('t');
const reduceQuery = matchMedia('(prefers-reduced-motion: reduce)');
const play = () => anims.forEach((animation) => animation.play());
const pause = () => anims.forEach((animation) => animation.pause());
const hasPinnedTime = requested !== null && Number.isFinite(Number(requested));
if (hasPinnedTime) seek(Number(requested));
else if (reduceQuery.matches) seek(9.70);

/* Live pages must react when the OS preference changes and must not burn frames
   in a hidden tab. Pinned ?t=N inspection always wins over both behaviours. */
reduceQuery.addEventListener('change', (event) => {
  if (hasPinnedTime) return;
  if (event.matches) seek(9.70);
  else play();
});
document.addEventListener('visibilitychange', () => {
  if (hasPinnedTime || reduceQuery.matches) return;
  if (document.hidden) pause();
  else play();
});

window.__anims = anims;
window.__seek = seek;
window.__setPlaying = (shouldPlay) => shouldPlay ? play() : pause();
window.__cycle = CYCLE/1000;
window.__ready = true;
</script>
</body>
</html>
