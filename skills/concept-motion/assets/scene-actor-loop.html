<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Human in the Loop — 6s</title>
<style>
/*
 * MECHANISM: actor circuit — a loop that only closes through a person.
 * CLAIM:     "the system proposes, but it cannot finish alone; your judgment
 *             goes back in and changes what it does next."
 *
 * Reference implementation for `references/actors-and-loops.md`. Read that
 * before adapting this — the rules below are the load-bearing ones.
 *
 * Why a circuit and not a phase spine: an earlier cut showed work halting at a
 * gate, which reads as the machine checking *itself*. "In the loop" needs three
 * things on screen at once — a machine node, a HUMAN node that is visibly a
 * different actor, and a return edge carrying the human's judgment back. The
 * return edge is the concept. Without it this is just approval.
 *
 * Colour is provenance, extending the kit's grammar:
 *   steel  = produced by the machine, not yet judged
 *   accent = carries a human decision
 * The AI node takes accent only AFTER the feedback lands. That late change is
 * the payoff, and it is what proves causation rather than coincidence.
 *
 * Zero dependencies: one CSS clock, everything derived from percentages of the
 * same 6s cycle, so any frame is reproducible and the file is double-clickable.
 * The playback loop is not incidental here — it IS the claim.
 */
:root{
  --canvas:#657689; --surface:#16242c; --raised:#1d2f39;
  --fg:#e8eef0; --muted:#8b989f; --steel:#5e7180; --accent:#3d8bff;
  --cycle:6s;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--canvas);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
/* Fixed 1600x900 design space, scaled as one unit. Letting the box resize and
   the contents reflow would mean every hand-placed coordinate below is wrong at
   some window size; scaling the whole stage keeps the composition exact.
   Centred by absolute positioning, not by grid — a grid item wider than the
   viewport centres its *unscaled* box and leaves the scaled result off-centre. */
.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;
  background:var(--surface);overflow:hidden;transform-origin:center center;
  transform:translate(-50%,-50%)}
.scale{position:absolute;inset:0}

/* ── titling ─────────────────────────────────────────────────────────────── */
.title{position:absolute;left:96px;top:92px;font-size:62px;font-weight:600;
  letter-spacing:-.022em;color:var(--fg);opacity:0;
  animation:titleIn var(--cycle) linear infinite}
.sub{position:absolute;left:100px;top:174px;font-size:25px;font-weight:400;
  letter-spacing:-.005em;color:var(--muted);opacity:0;
  animation:subIn var(--cycle) linear infinite}
@keyframes titleIn{0%{opacity:0;transform:translateY(8px)}6%,97%{opacity:1;transform:none}100%{opacity:1}}
@keyframes subIn{0%,3%{opacity:0}9%,97%{opacity:1}100%{opacity:1}}

/* ── the two actors ──────────────────────────────────────────────────────── */
.node{position:absolute;width:188px;height:188px;margin:-94px 0 0 -94px;
  border-radius:26px;display:grid;place-items:center;opacity:0;
  background:var(--raised);border:2px solid var(--steel)}
.node .glyph{width:84px;height:84px;display:block}
.node .tag{position:absolute;top:210px;width:100%;text-align:center;
  font-size:27px;font-weight:500;letter-spacing:-.01em;color:var(--muted)}
.ai{left:470px;top:520px;animation:aiNode var(--cycle) linear infinite}
.human{left:1130px;top:520px;animation:humanNode var(--cycle) linear infinite}
/* The machine wakes first, works while the token is out, then — only after the
   feedback lands at 68% — takes the accent. That late colour change is the
   whole claim: it changed because of the person. */
@keyframes aiNode{
  0%{opacity:0;transform:scale(.94);border-color:var(--steel)}
  7%{opacity:1;transform:none}
  10%{border-color:var(--fg)}
  30%{border-color:var(--steel)}
  68%{border-color:var(--steel);background:var(--raised)}
  76%{border-color:var(--accent);background:#20344a}
  97%{opacity:1;border-color:var(--accent);background:#20344a}
  100%{opacity:1}
}
@keyframes humanNode{
  0%{opacity:0;transform:scale(.94);border-color:var(--steel)}
  7%{opacity:1;transform:none}
  29%{border-color:var(--steel);transform:none}
  33%{border-color:var(--accent);transform:scale(1.05)}
  38%{transform:none}
  48%{border-color:var(--accent)}
  97%{border-color:var(--steel)}
  100%{opacity:1}
}
.ai .tag,.human .tag{opacity:1}
.ai .glyph{color:var(--steel);animation:aiGlyph var(--cycle) linear infinite}
.human .glyph{color:var(--steel);animation:humanGlyph var(--cycle) linear infinite}
@keyframes aiGlyph{0%,68%{color:var(--steel)}76%,100%{color:var(--accent)}}
@keyframes humanGlyph{0%,29%{color:var(--steel)}33%,97%{color:var(--accent)}100%{color:var(--steel)}}

/* One ring, once, at the moment of judgment — the only decorative flourish, and
   it marks the single most important instant in the clip. */
.ring{position:absolute;left:1130px;top:520px;width:188px;height:188px;
  margin:-94px 0 0 -94px;border-radius:26px;border:2px solid var(--accent);
  opacity:0;animation:ring var(--cycle) linear infinite}
@keyframes ring{
  0%,31%{opacity:0;transform:scale(1)}
  34%{opacity:.85}
  46%{opacity:0;transform:scale(1.42)}
  100%{opacity:0;transform:scale(1.42)}
}

/* ── the circuit ─────────────────────────────────────────────────────────── */
svg.wires{position:absolute;inset:0;width:1600px;height:900px;overflow:visible}
.wire{fill:none;stroke:#33454f;stroke-width:3}
.wire.live{stroke:var(--fg);stroke-dasharray:1 0;opacity:0}
.wire.live.top{animation:liveTop var(--cycle) linear infinite}
.wire.live.bot{stroke:var(--accent);animation:liveBot var(--cycle) linear infinite}
@keyframes liveTop{0%,10%{opacity:0}14%{opacity:.5}28%{opacity:.5}32%{opacity:0}100%{opacity:0}}
@keyframes liveBot{0%,48%{opacity:0}52%{opacity:.6}65%{opacity:.6}69%{opacity:0}100%{opacity:0}}
/* Arrowheads are markers with orient="auto", not hand-placed polygons: the head
   then rotates to the curve's own tangent at its endpoint. Guessed triangle
   coordinates cannot stay aligned — the tangent of a cubic here is ~39° off
   horizontal, and any later nudge to a control point silently breaks them. */
#aDim path{fill:#33454f}
#aFg  path{fill:var(--fg)}
#aAcc path{fill:var(--accent)}

/* ── what actually travels ───────────────────────────────────────────────── */
.tok{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:7px;
  margin:-15px 0 0 -15px;opacity:0;offset-rotate:0deg}
.out{background:var(--steel);
  offset-path:path("M 580 470 C 720 356 880 356 1020 470");
  animation:tokOut var(--cycle) linear infinite}
.back{background:var(--accent);
  offset-path:path("M 1020 610 C 880 726 720 726 580 610");
  animation:tokBack var(--cycle) linear infinite}
@keyframes tokOut{
  0%,10%{offset-distance:0%;opacity:0}
  13%{opacity:1}
  28%{offset-distance:100%;opacity:1}
  31%{offset-distance:100%;opacity:0}
  100%{offset-distance:100%;opacity:0}
}
@keyframes tokBack{
  0%,48%{offset-distance:0%;opacity:0}
  51%{opacity:1}
  66%{offset-distance:100%;opacity:1}
  70%{offset-distance:100%;opacity:0}
  100%{offset-distance:100%;opacity:0}
}

/* ── caption track ───────────────────────────────────────────────────────── */
.caps{position:absolute;left:0;right:0;top:790px;height:44px}
.cap{position:absolute;left:0;right:0;text-align:center;font-size:31px;
  font-weight:450;letter-spacing:-.012em;color:var(--fg);opacity:0}
.c1{animation:c1 var(--cycle) linear infinite}
.c2{animation:c2 var(--cycle) linear infinite}
.c3{animation:c3 var(--cycle) linear infinite}
.c4{animation:c4 var(--cycle) linear infinite}
/* Each caption owns an exclusive window. They share one slot, so any overlap
   would render two sentences on top of each other. */
@keyframes c1{0%,10%{opacity:0}13%,27%{opacity:1}30%,100%{opacity:0}}
@keyframes c2{0%,30%{opacity:0}33%,45%{opacity:1}48%,100%{opacity:0}}
@keyframes c3{0%,48%{opacity:0}51%,64%{opacity:1}67%,100%{opacity:0}}
@keyframes c4{0%,68%{opacity:0}71%,92%{opacity:1}96%,100%{opacity:0}}
.cap b{color:var(--accent);font-weight:600}

/* Reduced motion: freeze on the judgment frame — the one image that carries the
   claim on its own — rather than removing the explanation entirely. */
@media (prefers-reduced-motion: reduce){
  .title,.sub,.ai,.human,.ring,.wire.live,.arrow.b,.tok,.cap{
    animation-play-state:paused !important;animation-delay:-2.05s !important}
}
</style>
</head>
<body>
<div class="stage">
 <div class="scale" id="scale">
  <div class="title">Human in the Loop</div>
  <div class="sub">the system proposes — it can't close the loop alone</div>

  <svg class="wires" viewBox="0 0 1600 900">
    <defs>
      <!-- refX=10 puts the TIP on the path's endpoint, so the head reads as
           arriving at the node rather than floating short of it. -->
      <marker id="aDim" viewBox="0 0 10 10" refX="10" refY="5"
              markerWidth="5.5" markerHeight="5.5" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0.8 L10,5 L0,9.2 Z"/>
      </marker>
      <marker id="aFg" viewBox="0 0 10 10" refX="10" refY="5"
              markerWidth="5.5" markerHeight="5.5" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0.8 L10,5 L0,9.2 Z"/>
      </marker>
      <marker id="aAcc" viewBox="0 0 10 10" refX="10" refY="5"
              markerWidth="5.5" markerHeight="5.5" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0.8 L10,5 L0,9.2 Z"/>
      </marker>
    </defs>
    <!-- Each live overlay carries its own bright head, so the arrowhead
         brightens on exactly the same keyframes as its wire. -->
    <path class="wire"          d="M 580 470 C 720 356 880 356 1020 470" marker-end="url(#aDim)"/>
    <path class="wire live top" d="M 580 470 C 720 356 880 356 1020 470" marker-end="url(#aFg)"/>
    <path class="wire"          d="M 1020 610 C 880 726 720 726 580 610" marker-end="url(#aDim)"/>
    <path class="wire live bot" d="M 1020 610 C 880 726 720 726 580 610" marker-end="url(#aAcc)"/>
  </svg>

  <div class="node ai">
    <svg class="glyph" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.4"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="12" width="24" height="24" rx="5"/>
      <path d="M19 4v8M29 4v8M19 36v8M29 36v8M4 19h8M4 29h8M36 19h8M36 29h8"/>
    </svg>
    <div class="tag">AI</div>
  </div>

  <div class="node human">
    <svg class="glyph" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.4"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="16" r="8"/>
      <path d="M8 42c0-8.8 7.2-16 16-16s16 7.2 16 16"/>
    </svg>
    <div class="tag">You</div>
  </div>
  <div class="ring"></div>

  <div class="tok out"></div>
  <div class="tok back"></div>

  <div class="caps">
    <div class="cap c1">The AI produces a draft</div>
    <div class="cap c2">You <b>judge</b> it — approve, or correct</div>
    <div class="cap c3">Your decision goes <b>back in</b></div>
    <div class="cap c4">The next result is shaped by <b>you</b></div>
  </div>
 </div>
</div>
<script>
// Fit the 1600x900 design space into whatever the viewport is, so the file works
// in a slide, on a phone, or full-screen without editing any geometry.
// A ResizeObserver rather than a `resize` listener: the viewport can change
// without firing `resize` (embedded frames, devtools, presentation mode), and a
// stale scale silently crops the composition.
const stage = document.querySelector('.stage');
const fit = () => {
  const k = Math.min(document.documentElement.clientWidth / 1600,
                     document.documentElement.clientHeight / 900);
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
};
new ResizeObserver(fit).observe(document.documentElement);
fit();
</script>
</body>
</html>
